    <!-- JAVASCRIPT LOGIC -->
    <script>
        let isRegisterMode = false;
        let currentUser = JSON.parse(localStorage.getItem('soko_current_user')) || null;
        let isAdminActive = localStorage.getItem('soko_admin_active') === 'true';

        window.addEventListener('DOMContentLoaded', () => {
            if (isAdminActive) {
                document.getElementById('adminControlPanel').classList.remove('hidden');
            }
            updateNavigationUI();
            renderProducts();
        });

        function verifyAdminAccess() {
            const pass = prompt("Weka neno la siri la Admin:");
            if (pass === "BunguAdmin2026" || pass === "admin") {
                isAdminActive = true;
                localStorage.setItem('soko_admin_active', 'true');
                document.getElementById('adminControlPanel').classList.remove('hidden');
                alert("Umefanikiwa kuingia kama Admin!");
            } else {
                alert("Neno la siri si sahihi!");
            }
        }

        function openAuthModal(mode) {
            isRegisterMode = (mode === 'register');
            updateAuthModalUI();
            document.getElementById('authModal').classList.remove('hidden');
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            updateAuthModalUI();
        }
        
        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        }

        function updateAuthModalUI() {
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const btn = document.getElementById('authSubmitBtn');
            const usernameContainer = document.getElementById('businessUsernameContainer');
            const confirmPassContainer = document.getElementById('confirmPassContainer');
            const dpContainer = document.getElementById('dpContainer');
            const switchText = document.getElementById('authSwitchText');
            const switchBtn = document.getElementById('authSwitchBtn');

            if (isRegisterMode) {
                title.innerText = "Create Store Account";
                subtitle.innerText = "Register your business username, credentials & DP icon.";
                btn.innerText = "Register Store";
                usernameContainer.classList.remove('hidden');
                confirmPassContainer.classList.remove('hidden');
                dpContainer.classList.remove('hidden');
                document.getElementById('authUsername').setAttribute('required', 'true');
                document.getElementById('authConfirmPass').setAttribute('required', 'true');
                switchText.innerText = "Already have an account?";
                switchBtn.innerText = "Sign In";
            } else {
                title.innerText = "Welcome Back to Soko Faster";
                subtitle.innerText = "Sign in securely with your email and password.";
                btn.innerText = "Sign In";
                usernameContainer.classList.add('hidden');
                confirmPassContainer.classList.add('hidden');
                dpContainer.classList.add('hidden');
                document.getElementById('authUsername').removeAttribute('required');
                document.getElementById('authConfirmPass').removeAttribute('required');
                switchText.innerText = "Don't have an account?";
                switchBtn.innerText = "Register";
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;

            let users = JSON.parse(localStorage.getItem('soko_users')) || [];

            if (isRegisterMode) {
                const username = document.getElementById('authUsername').value;
                const confirmPass = document.getElementById('authConfirmPass').value;
                const dpFile = document.getElementById('authDpFile').files[0];

                if (pass !== confirmPass) {
                    alert("Password hazifanani! Tafadhali hakiki tena.");
                    return;
                }

                const existingUser = users.find(u => u.email === email);
                if (existingUser) {
                    alert("Akaunti yenye email hii tayari ipo! Tafadhali fanya Sign In.");
                    return;
                }

                let dpImage = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";
                if (dpFile) {
                    dpImage = await compressImage(dpFile, 0.7, 300);
                }

                currentUser = { username: username, email: email, pass: pass, dp: dpImage };
                users.push(currentUser);
                localStorage.setItem('soko_users', JSON.stringify(users));
                localStorage.setItem('soko_current_user', JSON.stringify(currentUser));
                alert(`Akaunti ya biashara (${username}) imetengenezwa kikamilifu!`);
            } else {
                const foundUser = users.find(u => u.email === email && u.pass === pass);
                if (foundUser) {
                    currentUser = foundUser;
                } else {
                    currentUser = { username: email.split('@')[0], email: email, dp: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" };
                }
                localStorage.setItem('soko_current_user', JSON.stringify(currentUser));
                alert(`Karibu tena ${currentUser.username}! Umefanikiwa kuingia kwenye duka lako.`);
            }

            updateNavigationUI();
            renderProducts();
            closeAuthModal();
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('soko_current_user');
            updateNavigationUI();
            renderProducts();
            alert("Umetoka kwenye akaunti yako salama. Unaweza kurudi wakati wowote kupitia Sign In bila kupoteza duka lako!");
        }

        function updateNavigationUI() {
            const navArea = document.getElementById('authNavArea');
            if (currentUser) {
                navArea.innerHTML = `
                    <div class="flex items-center gap-2 text-sm font-bold text-gray-900 bg-gray-100 px-3 py-1.5 rounded-lg">
                        <img src="${currentUser.dp || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}" class="w-6 h-6 rounded-full object-cover">
                        <span>${currentUser.username}</span>
                    </div>
                    <button onclick="handleLogout()" class="text-xs text-red-600 hover:underline font-semibold ml-2">Logout</button>
                `;
            } else {
                navArea.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-gray-600 hover:text-brand-600 transition">Sign In</button>
                    <span class="text-gray-300">/</span>
                    <button onclick="openAuthModal('register')" class="bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-gray-800 transition shadow-sm">Register</button>
                `;
            }
        }

        function openAddModal() {
            if (!currentUser) {
                alert("Tafadhali ingia kwenye akaunti yako (Sign In / Register) kwanza ndipo uweze kupost bidhaa!");
                openAuthModal('login');
                return;
            }
            document.getElementById('addProductModal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('addProductModal').classList.add('hidden');
        }

        function compressImage(file, quality = 0.75, maxWidth = 1200) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
            });
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('pTitle').value;
            const currency = document.getElementById('pCurrency').value;
            const price = document.getElementById('pPrice').value;
            const location = document.getElementById('pLocation').value;
            const category = document.getElementById('pCategory').value;
            const phone = document.getElementById('pPhone').value;
            const fileInput = document.getElementById('pImageFile').files[0];

            if (fileInput) {
                const compressedImageData = await compressImage(fileInput, 0.75);
                const formattedPrice = currency === 'TZS' ? `TZS ${Number(price).toLocaleString()}` : `$${Number(price).toFixed(2)}`;

                const newProduct = {
                    id: Date.now(),
                    title,
                    formattedPrice,
                    location,
                    category,
                    phone,
                    image: compressedImageData,
                    seller: currentUser ? currentUser.username : "Soko Merchant",
                    sellerDp: currentUser && currentUser.dp ? currentUser.dp : "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
                    views: 0,
                    comments: []
                };

                let products = JSON.parse(localStorage.getItem('soko_products')) || [];
                products.unshift(newProduct);
                localStorage.setItem('soko_products', JSON.stringify(products));

                renderProducts();
                closeAddModal();
                document.getElementById('productForm').reset();
            }
        }

        function incrementViews(id) {
            let products = JSON.parse(localStorage.getItem('soko_products')) || [];
            products = products.map(p => {
                if (p.id === id) {
                    p.views = (p.views || 0) + 1;
                }
                return p;
            });
            localStorage.setItem('soko_products', JSON.stringify(products));
            renderProducts();
        }

        function toggleFollow(sellerName) {
            if (!currentUser) {
                alert("Tafadhali ingia kwenye akaunti yako kwanza ili uweze kuanza kumfuata muuzaji (Follow Store)!");
                openAuthModal('login');
                return;
            }

            let followersMap = JSON.parse(localStorage.getItem('soko_store_followers')) || {};
            if (!followersMap[sellerName]) {
                followersMap[sellerName] = [];
            }

            const userIndex = followersMap[sellerName].indexOf(currentUser.username);
            if (userIndex > -1) {
                followersMap[sellerName].splice(userIndex, 1);
                alert(`Umeacha kumfuata ${sellerName}.`);
            } else {
                followersMap[sellerName].push(currentUser.username);
                alert(`Hongera! Sasa wewe ni mfuasi halisi (Real Follower) wa duka la ${sellerName}.`);
            }

            localStorage.setItem('soko_store_followers', JSON.stringify(followersMap));
            renderProducts();
        }

        function addComment(productId, event) {
            event.preventDefault();
            if (!currentUser) {
                alert("Tafadhali ingia kwenye akaunti yako (Sign In) kwanza ili uweze kuweka comment!");
                openAuthModal('login');
                return;
            }

            const inputId = `commentInput_${productId}`;
            const commentText = document.getElementById(inputId).value.trim();
            if (!commentText) return;

            let products = JSON.parse(localStorage.getItem('soko_products')) || [];
            products = products.map(p => {
                if (p.id === productId) {
                    if (!p.comments) p.comments = [];
                    p.comments.push({
                        username: currentUser.username,
                        dp: currentUser.dp || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80',
                        text: commentText,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                }
                return p;
            });

            localStorage.setItem('soko_products', JSON.stringify(products));
            renderProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let products = JSON.parse(localStorage.getItem('soko_products')) || [];
            
            const filtered = products.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.category.toLowerCase().includes(query) || 
                p.location.toLowerCase().includes(query) ||
                p.seller.toLowerCase().includes(query)
            );

            displayProducts(filtered);
        }

            let products = JSON.parse(localStorage.getItem('soko_products')) || [];
            if (products.length === 0) {

        function renderProducts() {
            let products = JSON.parse(localStorage.getItem('soko_products')) || [];
            if (products.length === 0) {
                products = [{
                    id: 1,
                    title: "Note 20",
                    formattedPrice: "TZS 780,000",
                    location: "Dodoma, TZ",
                    category: "Electronics & Gadgets",
                    phone: "+255 700 000 000",
                    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80",
                    seller: "BunguFX Store",
                    sellerDp: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
                    views: 0,
                    comments: [
                        { username: "Alex M.", dp: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80", text: "Bidhaa safi sana na bei nzuri!", time: "10:30 AM" }
                    ]
                }];
            }
            displayProducts(products);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            let followersMap = JSON.parse(localStorage.getItem('soko_store_followers')) || {};

            grid.innerHTML = products.map(p => {
                const isOwner = currentUser && currentUser.username === p.seller;
                const storeFollowers = followersMap[p.seller] || [];
                const followerCount = storeFollowers.length;
                const isFollowing = currentUser && storeFollowers.includes(currentUser.username);
                const commentsList = p.comments || [];

                return `
                    <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-xl transition group relative flex flex-col justify-between">
                        ${isOwner ? `
                            <button onclick="deleteProduct(${p.id})" class="absolute top-3 right-3 bg-red-600/90 hover:bg-red-700 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs backdrop-blur-md z-10 transition shadow" title="Futa Bidhaa Yako">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        ` : ''}
                        
                        <div>
                            <div class="relative h-64 bg-slate-900 overflow-hidden flex items-center justify-center p-2">
                                <img src="${p.image}" alt="${p.title}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300">
                                <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-full"><i class="fa-solid fa-location-dot mr-1 text-amber-400"></i> ${p.location}</span>
                                <span class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-md text-white text-[11px] px-2 py-0.5 rounded-full font-medium"><i class="fa-solid fa-eye mr-1 text-cyan-400"></i> ${p.views || 0} views</span>
                            </div>

                            <div class="p-5">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-semibold text-brand-600 uppercase">${p.category}</span>
                                    <div class="flex items-center gap-1.5 bg-indigo-50 border border-indigo-100 px-2 py-1 rounded-lg">
                                        <span class="text-[11px] font-bold text-indigo-700">${followerCount} Followers</span>
                                        ${!isOwner ? `
                                            <button onclick="toggleFollow('${p.seller}')" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-0.5 rounded font-medium transition shadow-sm">
                                                ${isFollowing ? 'Following' : '+ Follow'}
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 mb-2">
                                    <img src="${p.sellerDp || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}" class="w-7 h-7 rounded-full object-cover border border-brand-500">
                                    <span class="text-xs font-bold text-gray-900">${p.seller}</span>
                                </div>

                                <h3 class="font-bold text-gray-900 text-base mb-2 truncate">${p.title}</h3>
                                <div class="flex items-baseline justify-between mb-4">
                                    <span class="text-xl font-black text-gray-900">${p.formattedPrice}</span>
                                    <span class="text-xs text-gray-500">Retail / Wholesale</span>
                                </div>

                                <div class="border-t border-gray-100 pt-3 mt-3">
                                    <div class="text-xs font-bold text-gray-700 mb-2 flex items-center justify-between">
                                        <span><i class="fa-solid fa-comments text-brand-600 mr-1"></i> Maoni (${commentsList.length})</span>
                                    </div>
                                    <div class="max-h-32 overflow-y-auto space-y-2 mb-3 pr-1">
                                        ${commentsList.length === 0 ? '<p class="text-[11px] text-gray-400 italic">Hakuna maoni bado. Weka comment yako hapa chini!</p>' : 
                                          commentsList.map(c => `
                                            <div class="bg-gray-50 p-2 rounded-lg text-xs flex items-start gap-2">
                                                <img src="${c.dp}" class="w-5 h-5 rounded-full object-cover mt-0.5 shrink-0">
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex justify-between items-center">
                                                        <span class="font-bold text-gray-900 truncate">${c.username}</span>
                                                        <span class="text-[9px] text-gray-400">${c.time}</span>
                                                    </div>
                                                    <p class="text-gray-600 break-words">${c.text}</p>
                                                </div>
                                            </div>
                                          `).join('')}
                                    </div>
                                    <form onsubmit="addComment(${p.id}, event)" class="flex gap-1">
                                        <input type="text" id="commentInput_${p.id}" placeholder="Andika maoni yako..." class="w-full px-3 py-1.5 rounded-lg border border-gray-200 text-xs focus:ring-1 focus:ring-brand-500 focus:outline-none">
                                        <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition"><i class="fa-solid fa-paper-plane"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="px-5 pb-5 pt-2">
                            <a href="https://wa.me/${p.phone.replace(/[^0-9]/g, '')}?text=Habari,%20nahitaji%20kununua%20bidhaa%20hii:%20${encodeURIComponent(p.title)}" target="_blank" onclick="incrementViews(${p.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-brands fa-whatsapp text-lg"></i> Wasiliana na Muuzaji
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteProduct(id) {
            if (confirm("Una uhakika unataka kufuta bidhaa hii kwenye duka lako?")) {
                let products = JSON.parse(localStorage.getItem('soko_products')) || [];
                products = products.filter(p => p.id !== id);
                localStorage.setItem('soko_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function addSponsorPrompt() {
            const sponsorName = prompt("Ingiza jina la Sponsor mpya duniani:");
            if (sponsorName) {
                const container = document.getElementById('sponsorsContainer');
                const div = document.createElement('div');
                div.className = "flex items-center gap-2 text-xl font-black text-gray-700 shrink-0";
                div.innerHTML = `<i class="fa-solid fa-handshake text-brand-600"></i> ${sponsorName}`;
                container.appendChild(div);
            }
        }
    </script>
