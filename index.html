<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko faster - Nunua na Uuze Haraka</title>
    <!-- Tailwind CSS kwa ajili ya muonekano mzuri -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Appwrite Web SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-black text-rose-600">Soko<span class="text-gray-800">faster</span></h1>
            <div id="auth-section">
                <!-- Sehemu ya Login itabadilika mtumiaji akilogin -->
                <button onclick="loginWithApple()" class="bg-black text-white px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 hover:bg-gray-800 transition">
                     Ingia kwa iCloud (Apple)
                </button>
            </div>
        </div>
    </nav>

    <!-- Notification Bar -->
    <div id="notification-bar" class="bg-rose-500 text-white text-center py-2 text-sm font-medium hidden">
        🔔 Bidhaa mpya imepostiwa sokoni!
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Fomu ya Kuweka Bidhaa (Inaonekana kama umelogiwa) -->
        <div id="add-product-section" class="bg-white p-6 rounded-2xl shadow-sm mb-8 hidden">
            <h2 class="text-lg font-bold mb-4">Weka Bidhaa Mpya</h2>
            <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Jina la Bidhaa" required class="border p-3 rounded-xl focus:outline-rose-500">
                <input type="number" id="p-price" placeholder="Bei (TZS)" required class="border p-3 rounded-xl focus:outline-rose-500">
                <input type="text" id="p-location" placeholder="Location (Mf. Kariakoo, DSM)" required class="border p-3 rounded-xl focus:outline-rose-500">
                <input type="text" id="p-image" placeholder="Picha Link (URL)" class="border p-3 rounded-xl focus:outline-rose-500">
                <textarea id="p-desc" placeholder="Maelezo mafupi..." class="border p-3 rounded-xl md:col-span-2 focus:outline-rose-500"></textarea>
                <button type="submit" class="bg-rose-600 text-white py-3 rounded-xl font-bold md:col-span-2 hover:bg-rose-700 transition">Chapisha Bidhaa</button>
            </form>
        </div>

        <!-- Orodha ya Bidhaa -->
        <h2 class="text-xl font-bold mb-6">Bidhaa Mpya Zilizopo</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Hapa ndipo bidhaa zitakapojazwa na JavaScript kwa mpangilio wa mpya juu -->
            <p class="text-gray-500">Inapakia bidhaa...</p>
        </div>
    </main>

    <!-- JavaScript ya Kuunganisha Appwrite -->
    <script>
        const { Client, Databases, Account, ID, Query } = Appwrite;

        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1') // Endpoint yako ya Appwrite
            .setProject('6ac7a5bc003737e...'); // Weka Project ID yako hapa

        const databases = new Databases(client);
        const account = new Account(client);

        const DATABASE_ID = "Production TablesDB"; // Badilisha kama jina ni tofauti
        const COLLECTION_ID = "Products";

        // Kazi ya Kulogin kupitia Apple / iCloud
        function loginWithApple() {
            account.createOAuth2Session('apple', 'https://sokolako.com/success', 'https://sokolako.com/fail');
        }

        // Kupakia Bidhaa (Zile mpya zinakuja juu kupitia orderDesc)
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            try {
                const response = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_ID,
                    [Query.orderDesc('$createdAt')] // Amri inayofanya mpya ziwe juu na za zamani chini
                );

                if (response.documents.length === 0) {
                    grid.innerHTML = `<p class="text-gray-500">Hakuna bidhaa zilizowekwa bado.</p>`;
                    return;
                }

                grid.innerHTML = '';
                response.documents.forEach(product => {
                    grid.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 flex flex-col justify-between">
                            <img src="${product.image_url || 'https://via.placeholder.com/300'}" alt="${product.name}" class="h-48 w-full object-cover">
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start">
                                        <h3 class="font-bold text-lg">${product.name}</h3>
                                        <span class="text-xs bg-gray-100 px-2 py-1 rounded-md text-gray-600">📍 ${product.location || 'Tanzania'}</span>
                                    </div>
                                    <p class="text-rose-600 font-extrabold text-lg mt-1">TZS ${product.price.toLocaleString()}</p>
                                    <p class="text-gray-600 text-sm mt-2 line-clamp-2">${product.description || ''}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t flex justify-between items-center">
                                    <span class="text-xs text-gray-400">${new Date(product.$createdAt).toLocaleDateString()}</span>
                                    <!-- Kitufe cha kufuta kwa muuzaji -->
                                    <button onclick="deleteProduct('${product.$id}')" class="text-red-500 text-xs font-semibold hover:underline">Futa (Imeuzwa)</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Hitilafu:", error);
                grid.innerHTML = `<p class="text-red-500">Imeshindikana kupakia bidhaa.</p>`;
            }
        }

        // Kuweka Bidhaa Mpya
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const location = document.getElementById('p-location').value;
            const image_url = document.getElementById('p-image').value;
            const description = document.getElementById('p-desc').value;

            try {
                await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), {
                    name, price, location, image_url, description
                });
                alert('Bidhaa imetumwa mafanikio!');
                document.getElementById('product-form').reset();
                loadProducts(); // Pakia upya kuonyesha mpya juu kabisa
            } catch (err) {
                alert('Imeshindikana kuweka bidhaa: ' + err.message);
            }
        });

        // Kazi ya Kufuta Bidhaa ikiuzwa
        async function deleteProduct(id) {
            if(confirm("Una uhakika unataka kufuta bidhaa hii kwa sababu imeuzwa?")) {
                try {
                    await databases.deleteDocument(DATABASE_ID, COLLECTION_ID, id);
                    loadProducts();
                } catch(err) {
                    alert("Imeshindikana kufuta: " + err.message);
                }
            }
        }

        // Endesha wakati ukurasa unapofunguka
        loadProducts();
    </script>
</body>
</html>
